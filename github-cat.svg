<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Black Circle -->
  <circle cx="50" cy="50" r="50" fill="black" />
  
  <!-- White Cat Silhouette -->
  <!-- Head -->
  <circle cx="50" cy="50" r="30" fill="white" />
  <!-- Ears -->
  <polygon points="30,35 20,10 45,30" fill="white" />
  <polygon points="70,35 80,10 55,30" fill="white" />
  <!-- Eyes (Black) -->
  <ellipse cx="40" cy="45" rx="3" ry="5" fill="black" />
  <ellipse cx="60" cy="45" rx="3" ry="5" fill="black" />
  <!-- Nose (Black) -->
  <polygon points="48,55 52,55 50,60" fill="black" />
  <!-- Whiskers (Black Stroke) -->
  <line x1="30" y1="55" x2="10" y2="50" stroke="black" stroke-width="2" />
  <line x1="30" y1="60" x2="10" y2="65" stroke="black" stroke-width="2" />
  <line x1="70" y1="55" x2="90" y2="50" stroke="black" stroke-width="2" />
  <line x1="70" y1="60" x2="90" y2="65" stroke="black" stroke-width="2" />
</svg>
