<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frameworks and Tools</title>
    <!-- Iconify web component (supports many brand icon sets including simple-icons) -->
    <script src="https://code.iconify.design/iconify-icon/1.0.2/iconify-icon.min.js" defer></script>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container">
        <h1>frameworks and tools</h1>
        <div class="grid-container">
            <!-- Row 1 -->
            <div class="grid-item empty"></div>
            <div class="grid-item empty"></div>
            <div class="grid-item empty"></div>
            <div class="grid-item empty"></div>
            <div class="grid-item empty"></div>
            <div class="grid-item empty"></div>
            <!-- Row 1: 18 icons requested by user -->
            <div class="grid-item html">
                <!-- icon-only HTML5 (no wordmark) -->
                <img class="icon logos-img" src="https://api.iconify.design/devicon:html5.svg" alt="HTML5">
            </div>
            <div class="grid-item css">
                <!-- icon-only CSS3 (no wordmark) -->
                <img class="icon logos-img" src="https://api.iconify.design/devicon:css3.svg" alt="CSS3">
            </div>
            <div class="grid-item javascript">
                <img class="icon logos-img" src="https://api.iconify.design/logos:javascript.svg" alt="JavaScript">
            </div>
            <div class="grid-item typescript">
                <!-- icon-only TypeScript logo (matches JS style) -->
                <img class="icon logos-img" src="https://api.iconify.design/logos:typescript-icon.svg" alt="TypeScript">
            </div>
            <div class="grid-item react">
                <img class="icon logos-img" src="https://api.iconify.design/logos:react.svg" alt="React">
            </div>
            <div class="grid-item next">
                <img class="icon logos-img" src="https://api.iconify.design/logos:nextjs-icon.svg" alt="Next.js">
            </div>
            <div class="grid-item node">
                <img class="icon logos-img" src="https://api.iconify.design/logos:nodejs-icon.svg" alt="Node.js">
            </div>
            <div class="grid-item npm">
                <img class="icon logos-img" src="https://api.iconify.design/logos:npm-icon.svg" alt="npm">
            </div>

            <div class="grid-item mongo">
                <!-- icon-only MongoDB (no text/wordmark) -->
                <img class="icon logos-img" src="https://api.iconify.design/logos:mongodb-icon.svg" alt="MongoDB">
            </div>
            <div class="grid-item postgres">
                <img class="icon logos-img" src="https://api.iconify.design/logos:postgresql.svg" alt="PostgreSQL">
            </div>
            <div class="grid-item docker">
                <!-- use icon-only Docker image (no wordmark) so it matches the other icons -->
                <img class="icon logos-img" src="https://api.iconify.design/logos:docker-icon.svg" alt="Docker">
            </div>
            <div class="grid-item figma">
                <img class="icon logos-img" src="https://api.iconify.design/logos:figma.svg" alt="Figma">
            </div>
            <div class="grid-item git">
                <!-- icon-only Git logo (no text/wordmark) -->
                <img class="icon logos-img" src="https://api.iconify.design/logos:git-icon.svg" alt="Git">
            </div>
            <div class="grid-item github">
                <img class="logos-img"
                    src="https://upload.wikimedia.org/wikipedia/commons/9/91/Octicons-mark-github.svg" alt="GitHub">
            </div>
            <div class="grid-item gitlab">
                <img class="icon logos-img" src="https://api.iconify.design/logos:gitlab-icon.svg" alt="GitLab">
            </div>
            <div class="grid-item terminal">
                <img class="icon logos-img" src="https://api.iconify.design/logos:bash-icon.svg" alt="Terminal">
            </div>
            <div class="grid-item vite">
                <!-- External multi-color Vite logo (gradient triangle + yellow bolt) from Iconify's logos set -->
                <img class="icon vite-img" src="https://api.iconify.design/logos:vitejs.svg" alt="Vite logo">
            </div>
            <div class="grid-item mysql">
                <img class="icon logos-img" src="https://api.iconify.design/logos:mysql.svg" alt="MySQL">
            </div>
            <div class="grid-item empty"></div>
            <div class="grid-item empty"></div>
            <div class="grid-item empty"></div>
            <div class="grid-item empty"></div>
            <div class="grid-item empty"></div>
            <div class="grid-item empty"></div>
            <div class="grid-item empty"></div>
            <div class="grid-item empty"></div>
            <div class="grid-item empty"></div>
            <div class="grid-item empty"></div>
            <div class="grid-item empty"></div>
            <div class="grid-item empty"></div>
            <div class="grid-item empty"></div>
            <div class="grid-item empty"></div>

            <!-- Row 2 -->
            <div class="grid-item empty"></div>
            <div class="grid-item empty"></div>
            <div class="grid-item empty"></div>
            <div class="grid-item empty"></div>
            <div class="grid-item empty"></div>
            <div class="grid-item empty"></div>
            <div class="grid-item empty"></div>
            <div class="grid-item empty"></div>
            <div class="grid-item empty"></div>
            <div class="grid-item empty"></div>
            <div class="grid-item empty"></div>
            <div class="grid-item empty"></div>
            <div class="grid-item empty"></div>
            <div class="grid-item empty"></div>
            <div class="grid-item empty"></div>
            <div class="grid-item empty"></div>
            <div class="grid-item empty"></div>
            <div class="grid-item empty"></div>
            <div class="grid-item empty"></div>
            <div class="grid-item empty"></div>
        </div>
    </div>
</body>

</html>
